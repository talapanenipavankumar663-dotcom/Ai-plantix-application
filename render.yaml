services:
  - type: web
    name: plantix-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PLANTIX_PROVIDER
        value: demo
      - key: PLANTIX_ALLOWED_ORIGINS
        sync: false
